name: Build PDF OCR Portable Engine

on:
  push:
    branches:
      - build/pdf-ocr-portable-v03-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@v4

      - name: Build and verify trimmed portable engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'pdf-ocr-portable'
          $dist = Join-Path $root 'tools'
          $downloads = Join-Path $root 'downloads'
          New-Item -ItemType Directory -Force -Path $dist, $downloads | Out-Null

          $tessInstaller = Join-Path $downloads 'tesseract-ocr-w64-setup-5.5.3.20260724.exe'
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe' -OutFile $tessInstaller -UseBasicParsing
          $tessHash = (Get-FileHash $tessInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tessHash -ne 'bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4') {
            throw "Tesseract SHA256 mismatch: $tessHash"
          }

          $tessInstall = Join-Path $root 'Tesseract-OCR'
          $p = Start-Process -FilePath $tessInstaller -ArgumentList '/S',('/D=' + $tessInstall) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Tesseract installer failed: $($p.ExitCode)" }
          if (!(Test-Path (Join-Path $tessInstall 'tesseract.exe'))) { throw 'tesseract.exe not found after installer' }

          $tessDataSrc = Join-Path $tessInstall 'tessdata'
          New-Item -ItemType Directory -Force -Path $tessDataSrc | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn.traineddata' -OutFile (Join-Path $tessDataSrc 'jpn.traineddata') -UseBasicParsing
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata' -OutFile (Join-Path $tessDataSrc 'eng.traineddata') -UseBasicParsing

          # Trim Tesseract to the runtime-only subset used by this tool.
          $tessOut = Join-Path $dist 'tesseract'
          $tessDataOut = Join-Path $tessOut 'tessdata'
          New-Item -ItemType Directory -Force -Path $tessOut, $tessDataOut | Out-Null
          Copy-Item -LiteralPath (Join-Path $tessInstall 'tesseract.exe') -Destination $tessOut -Force
          Get-ChildItem -LiteralPath $tessInstall -File -Filter '*.dll' | Copy-Item -Destination $tessOut -Force
          Copy-Item -LiteralPath (Join-Path $tessDataSrc 'jpn.traineddata') -Destination $tessDataOut -Force
          Copy-Item -LiteralPath (Join-Path $tessDataSrc 'eng.traineddata') -Destination $tessDataOut -Force
          if (Test-Path (Join-Path $tessDataSrc 'osd.traineddata')) {
            Copy-Item -LiteralPath (Join-Path $tessDataSrc 'osd.traineddata') -Destination $tessDataOut -Force
          }
          foreach ($d in @('configs','tessconfigs')) {
            $src = Join-Path $tessDataSrc $d
            if (Test-Path $src) { Copy-Item -LiteralPath $src -Destination $tessDataOut -Recurse -Force }
          }

          $popZip = Join-Path $downloads 'Release-26.09.0-0.zip'
          Invoke-WebRequest -Uri 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip' -OutFile $popZip -UseBasicParsing
          $popHash = (Get-FileHash $popZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($popHash -ne '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0') {
            throw "Poppler SHA256 mismatch: $popHash"
          }
          $popExtract = Join-Path $root 'poppler-extract'
          Expand-Archive -LiteralPath $popZip -DestinationPath $popExtract -Force
          $library = Get-ChildItem -LiteralPath $popExtract -Directory -Recurse | Where-Object { $_.Name -eq 'Library' } | Select-Object -First 1
          if (!$library) { throw 'Poppler Library directory not found' }

          # Trim Poppler to runtime bin + share used by pdftoppm.
          $popOut = Join-Path $dist 'poppler'
          New-Item -ItemType Directory -Force -Path $popOut | Out-Null
          Copy-Item -LiteralPath (Join-Path $library.FullName 'bin') -Destination $popOut -Recurse -Force
          if (Test-Path (Join-Path $library.FullName 'share')) {
            Copy-Item -LiteralPath (Join-Path $library.FullName 'share') -Destination $popOut -Recurse -Force
          }

          $tesseract = Join-Path $tessOut 'tesseract.exe'
          $pdftoppm = Join-Path $popOut 'bin\pdftoppm.exe'
          $tessData = Join-Path $tessOut 'tessdata'

          & $tesseract --version
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract version check failed' }
          & $pdftoppm -v
          if ($LASTEXITCODE -ne 0) { throw 'Poppler version check failed' }

          Add-Type -AssemblyName System.Drawing
          $img = New-Object System.Drawing.Bitmap 1400,300
          $g = [System.Drawing.Graphics]::FromImage($img)
          $g.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font('Arial',72,[System.Drawing.FontStyle]::Regular)
          $g.DrawString('OCR TEST 123',$font,[System.Drawing.Brushes]::Black,40,80)
          $testPng = Join-Path $root 'ocr-test.png'
          $img.Save($testPng,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $font.Dispose(); $img.Dispose()
          $testOut = Join-Path $root 'ocr-test'
          & $tesseract $testPng $testOut -l eng --psm 7 --tessdata-dir $tessData
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract smoke OCR failed' }
          $ocrText = Get-Content ($testOut + '.txt') -Raw
          if ($ocrText -notmatch 'OCR\s+TEST\s+123') { throw "Unexpected OCR smoke output: $ocrText" }

          $samplePdf = Join-Path $root 'poppler-sample.pdf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/oschwartz10612/poppler-windows/master/sample.pdf' -OutFile $samplePdf -UseBasicParsing
          $renderPrefix = Join-Path $root 'render-test'
          & $pdftoppm -f 1 -singlefile -png -r 72 $samplePdf $renderPrefix
          if ($LASTEXITCODE -ne 0 -or !(Test-Path ($renderPrefix + '.png'))) { throw 'Poppler render smoke test failed' }

          $jpnHash = (Get-FileHash (Join-Path $tessData 'jpn.traineddata') -Algorithm SHA256).Hash.ToLowerInvariant()
          $engHash = (Get-FileHash (Join-Path $tessData 'eng.traineddata') -Algorithm SHA256).Hash.ToLowerInvariant()
          $tessExeHash = (Get-FileHash $tesseract -Algorithm SHA256).Hash.ToLowerInvariant()
          $pdfToPpmHash = (Get-FileHash $pdftoppm -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            'PDF OCR portable engine',
            'BuildResult=PASS',
            'BuildEnvironment=GitHub windows-latest',
            'Tesseract=5.5.3.20260724',
            'TesseractInstallerSHA256=bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4',
            ('TesseractExeSHA256=' + $tessExeHash),
            ('JpnTraineddataSHA256=' + $jpnHash),
            ('EngTraineddataSHA256=' + $engHash),
            'Poppler=26.09.0-0',
            'PopplerZipSHA256=7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0',
            ('PdftoppmExeSHA256=' + $pdfToPpmHash),
            'Languages=jpn+eng',
            'TrimmedRuntime=TESSERACT_DLLS+TESSDATA',
            'TrimmedRuntime=POPPLER_BIN+SHARE',
            'SmokeTest=TESSERACT_PASS',
            'SmokeTest=POPPLER_PASS'
          ) | Set-Content -LiteralPath (Join-Path $dist 'ENGINE_BUILD_INFO.txt') -Encoding UTF8

          Write-Host 'Trimmed portable engine PASS'

      - name: Verify no-PowerShell CMD paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'pdf-ocr-portable'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'portable-test\00_ENGINE_CHECK_CMD.cmd') -Destination $root -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'portable-test\01_OCR_DRAGDROP_NO_POWERSHELL.cmd') -Destination $root -Force

          cmd.exe /d /c ('"' + (Join-Path $root '00_ENGINE_CHECK_CMD.cmd') + '"')
          if ($LASTEXITCODE -ne 0) { throw "CMD engine diagnostic failed: $LASTEXITCODE" }

          $samplePdf = Join-Path $root 'cmd-sample.pdf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/oschwartz10612/poppler-windows/master/sample.pdf' -OutFile $samplePdf -UseBasicParsing
          cmd.exe /d /c ('"' + (Join-Path $root '01_OCR_DRAGDROP_NO_POWERSHELL.cmd') + '" "' + $samplePdf + '"')
          if ($LASTEXITCODE -ne 0) { throw "CMD OCR fallback failed: $LASTEXITCODE" }

          $result = Get-ChildItem -LiteralPath (Join-Path $root 'results') -Recurse -File -Filter 'OCR_RESULT.txt' | Select-Object -First 1
          if (!$result -or $result.Length -le 0) { throw 'CMD OCR result missing or empty' }
          Write-Host ('CMD fallback PASS: ' + $result.FullName)

      - name: Verify Unicode-root OCR with ASCII-relative external paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcRoot = Join-Path $env:RUNNER_TEMP 'pdf-ocr-portable'
          $jpRoot = Join-Path $env:RUNNER_TEMP '日本語 パス テスト'
          if (Test-Path $jpRoot) { Remove-Item -LiteralPath $jpRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $jpRoot | Out-Null

          Copy-Item -LiteralPath (Join-Path $srcRoot 'tools') -Destination $jpRoot -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'portable-test\01_OCR_RELATIVE_PATH_V032.cmd') -Destination (Join-Path $jpRoot '01_OCR_RELATIVE_PATH_V032.cmd') -Force

          $samplePdf = Join-Path $jpRoot '日本語 名称 請求書.pdf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/oschwartz10612/poppler-windows/master/sample.pdf' -OutFile $samplePdf -UseBasicParsing

          Push-Location $jpRoot
          try {
            cmd.exe /d /c ('01_OCR_RELATIVE_PATH_V032.cmd "' + $samplePdf + '" < nul')
            if ($LASTEXITCODE -ne 0) { throw "Unicode-root relative-path OCR failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $result = Join-Path $jpRoot 'results\OCR_RESULT_latest.txt'
          if (!(Test-Path $result)) { throw 'Unicode-root OCR result missing' }
          if ((Get-Item $result).Length -le 0) { throw 'Unicode-root OCR result empty' }
          Write-Host ('Unicode-root relative-path OCR PASS: ' + $result)

      - name: Verify PowerShell OCR from Japanese Windows path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcRoot = Join-Path $env:RUNNER_TEMP 'pdf-ocr-portable'
          $jpRoot = Join-Path $env:RUNNER_TEMP '日本語 PowerShell OCR'
          if (Test-Path $jpRoot) { Remove-Item -LiteralPath $jpRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $jpRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $srcRoot 'tools') -Destination $jpRoot -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'portable-test\ocr_v032.ps1') -Destination (Join-Path $jpRoot 'ocr.ps1') -Force

          $samplePdf = Join-Path $jpRoot '日本語 請求書.pdf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/oschwartz10612/poppler-windows/master/sample.pdf' -OutFile $samplePdf -UseBasicParsing
          & (Join-Path $jpRoot 'ocr.ps1') -PdfPath $samplePdf -NoOpen
          if ($LASTEXITCODE -ne 0) { throw "PowerShell Unicode-root OCR failed: $LASTEXITCODE" }

          $result = Join-Path $jpRoot 'results\OCR_RESULT_latest.txt'
          if (!(Test-Path $result)) { throw 'PowerShell Unicode-root OCR result missing' }
          if ((Get-Item $result).Length -le 0) { throw 'PowerShell Unicode-root OCR result empty' }
          Write-Host ('PowerShell Unicode-root OCR PASS: ' + $result)

      - name: Upload trimmed portable engine
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ocr-portable-engine-v03-trimmed
          path: ${{ runner.temp }}/pdf-ocr-portable/tools
          if-no-files-found: error
          compression-level: 6
