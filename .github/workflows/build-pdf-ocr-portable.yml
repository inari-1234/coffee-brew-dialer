name: Build PDF OCR Portable Engine

on:
  push:
    branches:
      - build/pdf-ocr-portable-v03-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Build portable engine bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'pdf-ocr-portable'
          $dist = Join-Path $root 'tools'
          $downloads = Join-Path $root 'downloads'
          New-Item -ItemType Directory -Force -Path $dist, $downloads | Out-Null

          $tessInstaller = Join-Path $downloads 'tesseract-ocr-w64-setup-5.5.3.20260724.exe'
          $tessUrl = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe'
          Invoke-WebRequest -Uri $tessUrl -OutFile $tessInstaller -UseBasicParsing
          $tessHash = (Get-FileHash $tessInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tessHash -ne 'bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4') {
            throw "Tesseract SHA256 mismatch: $tessHash"
          }

          $tessInstall = Join-Path $root 'Tesseract-OCR'
          $p = Start-Process -FilePath $tessInstaller -ArgumentList '/S',('/D=' + $tessInstall) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Tesseract installer failed: $($p.ExitCode)" }
          $tesseract = Join-Path $tessInstall 'tesseract.exe'
          if (!(Test-Path $tesseract)) { throw "tesseract.exe not found after installer" }

          $tessData = Join-Path $tessInstall 'tessdata'
          New-Item -ItemType Directory -Force -Path $tessData | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn.traineddata' -OutFile (Join-Path $tessData 'jpn.traineddata') -UseBasicParsing
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata' -OutFile (Join-Path $tessData 'eng.traineddata') -UseBasicParsing

          $tessOut = Join-Path $dist 'tesseract'
          Copy-Item -LiteralPath $tessInstall -Destination $tessOut -Recurse -Force

          $popZip = Join-Path $downloads 'Release-26.09.0-0.zip'
          $popUrl = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip'
          Invoke-WebRequest -Uri $popUrl -OutFile $popZip -UseBasicParsing
          $popHash = (Get-FileHash $popZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($popHash -ne '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0') {
            throw "Poppler SHA256 mismatch: $popHash"
          }
          $popExtract = Join-Path $root 'poppler-extract'
          Expand-Archive -LiteralPath $popZip -DestinationPath $popExtract -Force
          $library = Get-ChildItem -LiteralPath $popExtract -Directory -Recurse | Where-Object { $_.Name -eq 'Library' } | Select-Object -First 1
          if (!$library) { throw 'Poppler Library directory not found' }
          Copy-Item -LiteralPath $library.FullName -Destination (Join-Path $dist 'poppler') -Recurse -Force

          $pdftoppm = Get-ChildItem -LiteralPath (Join-Path $dist 'poppler') -Recurse -File -Filter 'pdftoppm.exe' | Select-Object -First 1
          if (!$pdftoppm) { throw 'pdftoppm.exe not found' }

          & (Join-Path $dist 'tesseract\tesseract.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract version check failed' }
          & $pdftoppm.FullName -v
          if ($LASTEXITCODE -ne 0) { throw 'Poppler version check failed' }

          Add-Type -AssemblyName System.Drawing
          $img = New-Object System.Drawing.Bitmap 1400,300
          $g = [System.Drawing.Graphics]::FromImage($img)
          $g.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font('Arial',72,[System.Drawing.FontStyle]::Regular)
          $g.DrawString('OCR TEST 123',$font,[System.Drawing.Brushes]::Black,40,80)
          $testPng = Join-Path $root 'ocr-test.png'
          $img.Save($testPng,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $font.Dispose(); $img.Dispose()
          $testOut = Join-Path $root 'ocr-test'
          & (Join-Path $dist 'tesseract\tesseract.exe') $testPng $testOut -l eng --psm 7 --tessdata-dir (Join-Path $dist 'tesseract\tessdata')
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract smoke OCR failed' }
          $ocrText = Get-Content ($testOut + '.txt') -Raw
          if ($ocrText -notmatch 'OCR\s+TEST\s+123') { throw "Unexpected OCR smoke output: $ocrText" }

          $samplePdf = Join-Path $root 'poppler-sample.pdf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/oschwartz10612/poppler-windows/master/sample.pdf' -OutFile $samplePdf -UseBasicParsing
          $renderPrefix = Join-Path $root 'render-test'
          & $pdftoppm.FullName -f 1 -singlefile -png -r 72 $samplePdf $renderPrefix
          if ($LASTEXITCODE -ne 0 -or !(Test-Path ($renderPrefix + '.png'))) { throw 'Poppler render smoke test failed' }

          @(
            'PDF OCR portable engine',
            'Built on GitHub windows-latest',
            'Tesseract=5.5.3.20260724',
            'TesseractInstallerSHA256=bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4',
            'Poppler=26.09.0-0',
            'PopplerZipSHA256=7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0',
            'Languages=jpn+eng',
            'SmokeTest=TESSERACT_PASS',
            'SmokeTest=POPPLER_PASS'
          ) | Set-Content -LiteralPath (Join-Path $root 'ENGINE_BUILD_INFO.txt') -Encoding UTF8

          Copy-Item -LiteralPath (Join-Path $root 'ENGINE_BUILD_INFO.txt') -Destination (Join-Path $dist 'ENGINE_BUILD_INFO.txt') -Force

          Write-Host "Portable engine build PASS"

      - name: Upload portable engine
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ocr-portable-engine-v03
          path: ${{ runner.temp }}/pdf-ocr-portable/tools
          if-no-files-found: error
          compression-level: 6
